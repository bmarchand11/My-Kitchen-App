# Builds the iPhone app on Expo's servers and sends it to TestFlight.
# Run it from the repository's Actions tab: "Build for TestFlight" → "Run workflow".
# The README's "Installing on an iPhone" section lists the one-time setup.
name: Build for TestFlight

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the setup is complete
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=()
          [ -n "$EXPO_TOKEN" ] || missing+=("secret EXPO_TOKEN")
          [ -n "$ASC_API_KEY_P8" ] || missing+=("secret ASC_API_KEY_P8")
          [ -n "$EXPO_ASC_KEY_ID" ] || missing+=("secret ASC_KEY_ID")
          [ -n "$EXPO_ASC_ISSUER_ID" ] || missing+=("secret ASC_ISSUER_ID")
          [ -n "$EXPO_APPLE_TEAM_ID" ] || missing+=("secret APPLE_TEAM_ID")
          [ -n "$ASC_APP_ID" ] || missing+=("variable ASC_APP_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Still needed in Settings → Secrets and variables → Actions: ${missing[*]}"
            exit 1
          fi

      - run: npm ci

      - name: Prepare the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc/key.p8" >> "$GITHUB_ENV"

      - name: Point the upload at the App Store Connect app
        run: |
          jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

      - name: Link the Expo project
        run: npx --yes eas-cli@25.3.0 init --non-interactive --force

      - name: Build and send to TestFlight
        run: npx --yes eas-cli@25.3.0 build --platform ios --profile production --non-interactive --auto-submit
